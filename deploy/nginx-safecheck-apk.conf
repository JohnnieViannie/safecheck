# Snippet for safebangle.com — serve the Android APK at /safecheck.apk
# Include inside your HTTPS server { } block for safebangle.com

# Django API (adjust socket/port to match your gunicorn setup)
location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8000;
}

# Profile pictures. Point this at backend/media on your server (Django's MEDIA_ROOT).
location /media/ {
    alias /path/to/safeBangle/backend/media/;
    add_header X-Content-Type-Options nosniff;
    expires 7d;
}

# Direct APK download
location = /safecheck.apk {
    alias /var/www/safecheck/public/safecheck.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="safecheck.apk"';
    add_header Cache-Control "public, max-age=300";
}

# Optional: health check without hitting Django admin
location = /api-health {
    return 302 /api/health/;
}
